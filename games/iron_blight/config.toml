# Bridge settings. Trigger values: position 0-9 (0 = released), force 0-8. LT is left to the DSX profile.

[dsx]
port = 0               # 0 = read %LOCALAPPDATA%\DSX\DSX_UDP_PortNumber.txt (fallback 6969)
controller = 0         # DSX controller index
resend_seconds = 1.0   # re-send the current effect this often so DSX stays in sync

[loop]
hz = 200               # how often the shot counter is checked; higher = pulse closer to the shot

[game]
# Exe name(s) of the running game.
process_names = ["Iron Blight.exe"]   # the running game exe (Task Manager -> Details)

[fire]                 # RT - primary weapons: one vibration pulse per shot the game fires
pulse_strength = 8     # pulse strength (0-8), the same for every shot
pulse_frequency = 12   # vibration speed inside a pulse; low = a knock, high = a buzz (keep < 40)
pulse_seconds = 0.12   # pulse length for a shot after a pause (tap, single shots at empty) ...
pulse_share = 0.5      # ... capped at this share of the gap since the previous shot, so held fire
                       # (e.g. 0.15 s apart -> 0.075 s pulses) stays one knock per shot
pulse_break = 0.02     # minimum rest between two pulses, so fast shots never blur together
base_start = 2         # between shots: light resistance from this point of the pull (0-9) ...
base_force = 1         # ... with this force (0-8), the same at any energy; 0 = none

[hit]                  # hull damage -> lightbar flash
min_drop = 0.01        # hull fraction lost in one frame that counts as a hit

[lightbar]             # hull -> lightbar colour while flying (menus keep the DSX profile colour)
enabled = true
red_at = 0.2           # hull fraction that is full red; 100% is green, halfway between is yellow
critical = 0.25        # below this the light pulses ...
pulse_hz = [1.0, 3.0]  # ... from this speed at `critical` to this speed at 0 hull
pulse_min = 0.25       # darkest point of the pulse (0-1)
smooth_seconds = 0.4   # colour eases over ~3x this; a hit snaps to red and eases back to the hull colour
