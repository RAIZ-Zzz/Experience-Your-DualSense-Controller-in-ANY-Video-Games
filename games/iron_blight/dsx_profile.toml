# DSX settings for this game, applied on top of `base_profile` to produce the profile `name`.
# Keys are DSX's own (see <DSX>\DSX_Savefile\Configuration Files\Controller Profiles\*.dsx);
# a misspelt key stops the script instead of being silently ignored.
# Apply: close DSX, run apply-dsx-profile.bat, start DSX.
# Anything changed in the DSX UI for this profile must also go here, or the next apply undoes it.

dsx_dir = 'D:\steam\steamapps\common\DSX\Main_v3_Beta'
base_profile = "Default Profile"
name = "Iron Blight"

[controller_general]
ActiveVirtualDevice = "XBOX_360"     # most PC games only understand Xbox pads

[controller_adaptive_triggers]
lt_type = "OFF"                      # RT is driven live by the bridge; LT left alone
rt_type = "OFF"
